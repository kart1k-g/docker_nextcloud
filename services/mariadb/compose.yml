services:
  mariadb:
    image: mariadb:11

    container_name: mariadb

    restart: unless-stopped

    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - db:/var/lib/mysql

    networks:
      - nextcloud

volumes:
  db:

networks:
  nextcloud:
    external: true